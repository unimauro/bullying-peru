name: Actualizar noticias (diario)

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC ≈ 06:00 Perú, todos los días
  workflow_dispatch: {}      # permite ejecutarlo manualmente

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar noticias (Google News RSS)
        run: python scripts/update_news.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/news assets/news)" ]; then
            git add data/news/news.json assets/news
            git commit -m "chore: actualización automática de noticias ($(date -u +%F))"
            git push
          else
            echo "Sin cambios en noticias."
          fi
