name: Actualizar noticias (diario)

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC ≈ 06:00 Perú, todos los días
  workflow_dispatch: {}      # permite ejecutarlo manualmente

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Actualizar noticias (Google News RSS)
        run: python scripts/update_news.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/news assets/news)" ]; then
            git add data/news/news.json assets/news
            git commit -m "chore: actualización automática de noticias ($(date -u +%F))"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
            git push
          else
            echo "Sin cambios en noticias."
          fi
